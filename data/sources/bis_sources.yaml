# ==============================================================================
# Official BIS Source Registry (Comprehensive Edition)
# Authoritative Indian Standards & Regulatory Source Registry
#
# Constraints & Principles:
# 1. Allowlist enforcement: ONLY official government (.gov.in, .nic.in) and
#    statutory standards publishing portals are permitted.
# 2. Strict Rights Policy: Material rights classified as PUBLIC, AUTHORIZED,
#    LOGIN_REQUIRED, or LICENSE_REQUIRED.
# 3. Discovery Method: Explicitly defined for each endpoint (API, HTML, Table, etc.).
# ==============================================================================

