# Official BIS Source Registry
# Machine-readable registry of verified government and regulatory endpoints for the BIS Intelligence Engine.

sources:
  - source_id: bis_main_portal
    organization: Bureau of Indian Standards
    canonical_url: https://www.bis.gov.in
    source_type: OFFICIAL_PORTAL
    jurisdiction: INDIA:NATIONAL
    document_types:
      - GENERAL_INFORMATION
      - ORGANIZATIONAL_STRUCTURE
      - ANNUAL_REPORT
    discovery_method: HTML_LINK_CRAWL
    crawl_frequency: WEEKLY
    authority_level: STATUTORY_NATIONAL
    access_policy: PUBLIC
    rights_policy: PUBLIC
    domain_allowlist:
      - www.bis.gov.in
      - bis.gov.in
    enabled: true

