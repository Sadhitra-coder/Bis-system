      - AMENDMENT_METADATA
      - COMMITTEE_INFO
    discovery_method: ELASTICSEARCH_POST_API
    crawl_frequency: DAILY
    authority_level: STATUTORY_NATIONAL
    access_policy: PUBLIC
    rights_policy: PUBLIC
    domain_allowlist:
      - www.services.bis.gov.in
    enabled: true

